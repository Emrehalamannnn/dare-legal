title: DARE
description: One dare. Everyone. Every day. Do the daily dare, post your proof, and let your friends vote with 🔥.
url: https://getdareapp.com
markdown: kramdown
defaults:
  - scope: { path: "" }
    values: { layout: page }
exclude: [README.md]
# Universal Links: Jekyll skips dot folders unless they're listed. The file
# .well-known/apple-app-site-association (no extension, no front matter) is
# copied as-is, so invite links (/add/ and /s/) open the DARE app.
include: [".well-known"]
