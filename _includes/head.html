<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }}{% else %}DARE: One dare a day{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0d0d12">
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
<meta property="og:title" content="{{ page.title | default: 'DARE: One dare a day' }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="https://getdareapp.com/assets/img/icon.png">
<meta property="og:url" content="https://getdareapp.com{{ page.url | replace: 'index.html', '' }}">
{% if page.invite %}
<!-- Invite pages: personal links, so not in search results, no referrer sent
     anywhere. -->
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
{% endif %}
<!-- No page loads anything from other sites (no web fonts, no analytics, no
     tracking): visitors' IP addresses only reach GitHub Pages. -->
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
